<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practical Time</title>

    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <h1 class="title">Practical Time</h1>

    <section class="cards">

        <!-- Tarjeta 1 -->
        <article class="card">

            <div class="card__header"></div>

            <div class="card__image">
                <img src="https://i.pravatar.cc/150?img=11" alt="Perfil">
            </div>

            <div class="card__body">

                <h2 class="card__name">Jhon Doe</h2>

                <div class="card__line"></div>

                <p class="card__text">
                    Lorem ipsum dolor sit amet, consectetur adipisicing elit
                    et cupiditate deleniti.
                </p>

                <div class="card__actions">
                    <i class="fa-solid fa-plus"></i>
                    <i class="fa-brands fa-whatsapp"></i>
                    <i class="fa-solid fa-envelope"></i>
                </div>

            </div>

            <div class="card__footer">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-linkedin-in"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-instagram"></i>
            </div>

        </article>

        <!-- Tarjeta 2 -->
        <article class="card">

            <div class="card__header card__header--right"></div>

            <div class="card__image">
                <img src="https://i.pravatar.cc/150?img=32" alt="Perfil">
            </div>

            <div class="card__body">

                <h2 class="card__name">Allison Walker</h2>

                <div class="card__line"></div>

                <p class="card__text">
                    Lorem ipsum dolor sit amet, consectetur adipisicing elit
                    et cupiditate deleniti.
                </p>

                <div class="card__actions">
                    <i class="fa-solid fa-plus"></i>
                    <i class="fa-brands fa-whatsapp"></i>
                    <i class="fa-solid fa-envelope"></i>
                </div>

            </div>

            <div class="card__footer">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-linkedin-in"></i>
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-instagram"></i>
            </div>

        </article>

    </section>

</body>
</html>
