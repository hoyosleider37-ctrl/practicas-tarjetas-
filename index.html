<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de Tarjetas Responsivas</title>
    
    <!-- CDN de FontAwesome (Proporcionado en tu asignación) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    
    <!-- Enlace a tus estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="container">
        <!-- Tarjeta Principal (Ejemplo aplicando BEM) -->
        <article class="card">
            <!-- Contenedor de la imagen con Clip-Path -->
            <div class="card__hero">
                <img src="https://placeholder.com" alt="Card Header" class="card__img">
            </div>
            
            <div class="card__content">
                <h2 class="card__title">Título de la Tarjeta</h2>
                <p class="card__text">Esta es una descripción corta para practicar el diseño de tarjetas responsivas utilizando CSS moderno.</p>
                
                <!-- Botón de acción con Icono de FontAwesome -->
                <a href="#" class="card__button">
                    <i class="fa-brands fa-whatsapp card__icon"></i> Contactar
                </a>
            </div>
        </article>
    </main>

</body>
</html>
